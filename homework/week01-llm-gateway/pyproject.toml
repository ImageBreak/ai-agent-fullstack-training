[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "week01-llm-gateway"
version = "0.1.0"
description = "A layered Chat Completions gateway with two upstream protocols"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "jinja2>=3.1.6,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pyyaml>=6,<7",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "live: explicitly enabled, billable upstream smoke tests",
  "routing: two-protocol routing",
  "streaming: SSE conversion and real local transport",
  "structured: JSON validation and repair",
  "prompts: immutable prompt versions",
  "observability: usage and latency accounting",
  "resilience: retry budgets and timeouts",
  "limits: rate, concurrency and resource limits",
  "security: authentication and safe configuration",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
